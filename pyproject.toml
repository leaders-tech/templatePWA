# This file keeps the Python project settings, dependencies, and test/tool config.
# Edit this file when Python packages or shared Python tool settings change.
# Copy a config pattern here when you add another small shared Python tool setting.
# Add new Python packages with `uv add` or `uv add --dev` instead of editing dependency lists by hand.
[project]
name = "templatepwa"
version = "0.1.0"
description = "Minimal PWA template with React, aiohttp, and SQLite"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.5,<4",
    "aiosqlite>=0.22.1,<0.23",
    "argon2-cffi>=25.1.0,<26",
    "itsdangerous>=2.2.0,<3",
    "python-dotenv>=1.2.4,<2",
    "yoyo-migrations>=9.0.0,<10",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
    "pytest-aiohttp>=1.1.1,<2",
    "pytest-asyncio>=1.4.1.post1,<2",
    "ruff>=0.17.3,<0.18",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
line-length = 160
target-version = "py314"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
